name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[backend,test]"
      - run: python -m compileall src backend
      - run: pytest -q
      - name: History-constrained flower prototype regression
        run: pytest -q tests/test_flower_prototype.py
      - run: pytest -q tests/test_roller_recognition.py tests/test_roller_recognition_api.py
      - name: Synthetic recognition acceptance and determinism
        run: |
          python scripts/run_phase17_synthetic.py --output /tmp/phase17-recognition-a.json
          python scripts/run_phase17_synthetic.py --output /tmp/phase17-recognition-b.json
          cmp --silent /tmp/phase17-recognition-a.json /tmp/phase17-recognition-b.json
      - name: Phase 18 validation, migration, and determinism
        run: |
          python scripts/run_phase18_synthetic.py --output /tmp/phase18-a.json
          python scripts/run_phase18_synthetic.py --output /tmp/phase18-b.json
          cmp --silent /tmp/phase18-a.json /tmp/phase18-b.json
          pytest -q tests/test_validated_usage.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build

  docker:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build --no-cache --progress=plain
      - name: Smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            exit_code=$?
            docker compose ps || true
            docker compose logs --no-color || true
            docker compose down -v || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          docker compose up -d
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/api/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:5173/
