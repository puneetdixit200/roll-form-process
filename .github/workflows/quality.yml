name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'release/**'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[backend,test]"
      - run: python -m compileall src backend
      - run: pytest -q
      - name: History-constrained flower prototype regression
        run: pytest -q tests/test_flower_prototype.py
      - name: Interactive visual flower generator regression
        run: pytest -q tests/test_visual_flower.py tests/test_visual_flower_api.py tests/test_visual_flower_import.py
      - run: pytest -q tests/test_roller_recognition.py tests/test_roller_recognition_api.py
      - name: Synthetic recognition acceptance and determinism
        run: |
          python scripts/run_phase17_synthetic.py --output /tmp/phase17-recognition-a.json
          python scripts/run_phase17_synthetic.py --output /tmp/phase17-recognition-b.json
          cmp --silent /tmp/phase17-recognition-a.json /tmp/phase17-recognition-b.json
      - name: Phase 18 validation, migration, and determinism
        run: |
          python scripts/run_phase18_synthetic.py --output /tmp/phase18-a.json
          python scripts/run_phase18_synthetic.py --output /tmp/phase18-b.json
          cmp --silent /tmp/phase18-a.json /tmp/phase18-b.json
          pytest -q tests/test_validated_usage.py
      - name: Phase 19 public CLRSG corpus and model determinism
        run: |
          set -euo pipefail
          python -m rollform_extractor synthetic-corpus-plan
          python -m rollform_extractor synthetic-corpus-generate --output /tmp/clrsg-corpus-a --samples-per-family 3 --seed 1729
          python -m rollform_extractor synthetic-corpus-validate /tmp/clrsg-corpus-a
          python -m rollform_extractor synthetic-corpus-generate --output /tmp/clrsg-corpus-b --samples-per-family 3 --seed 1729
          cmp --silent /tmp/clrsg-corpus-a/manifest.json /tmp/clrsg-corpus-b/manifest.json
          python -m rollform_extractor clrsg-train /tmp/clrsg-corpus-a --output /tmp/clrsg-model --ensemble-members 5 --seed 1729
          pytest -q tests/test_clrsg.py
      - name: Phase 20 private pipeline public-fixture regression
        run: |
          set -euo pipefail
          pytest -q tests/test_private_clrsg.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build

  docker:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build --no-cache --progress=plain
      - name: Smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            exit_code=$?
            docker compose ps || true
            docker compose logs --no-color || true
            docker compose down -v || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          docker compose up -d
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/api/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:5173/

  railway_runtime:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Railway image
        run: docker build --file Dockerfile.railway --tag rollform-railway-ci:local .
      - name: Smoke test Railway image with public fixture mode
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            exit_code=$?
            docker logs railway-demo-ci || true
            docker rm -f railway-demo-ci || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          docker run --detach --name railway-demo-ci --publish 8080:8000 \
            --env PORT=8000 \
            --env DEMO_AUTH_ENABLED=false \
            --env ROLLFORM_REQUIRE_PRIVATE_DATASET=false \
            --env ROLLFORM_REQUIRE_ACTIVE_MODEL=false \
            rollform-railway-ci:local
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/ready
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/
