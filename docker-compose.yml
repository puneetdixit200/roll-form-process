services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./web-workspace:/app/web-workspace
      - ./output:/app/output
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_ROOT: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
