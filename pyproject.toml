[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rollform-extractor"
version = "0.1.0"
description = "Offline DWG/DXF roll-forming extractor"
requires-python = ">=3.11"
dependencies = [
    "ezdxf",
    "matplotlib",
    "networkx",
    "numpy",
    "openpyxl",
    "pandas",
    "pillow",
    "pytest",
    "pyyaml",
    "scipy",
    "shapely",
    "sqlalchemy",
]

[project.scripts]
rollform-extractor = "rollform_extractor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
