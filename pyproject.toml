[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rollform-extractor"
version = "0.1.0"
description = "Offline DWG/DXF roll-forming extractor"
requires-python = ">=3.11"
dependencies = [
    "ezdxf",
    "matplotlib",
    "networkx",
    "numpy",
    "openpyxl",
    "pandas",
    "pillow",
    "python-multipart",
    "pyyaml",
    "scipy",
    "shapely",
    "sqlalchemy",
]

[project.optional-dependencies]
backend = [
    "fastapi",
    "uvicorn",
]
test = [
    "httpx2",
    "pytest",
]

[project.scripts]
rollform-extractor = "rollform_extractor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rollform_extractor = ["config/*.yaml", "report/templates/*.j2", "report/static/*.css", "report/static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
